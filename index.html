<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Air Hockey - Mobile & Desktop</title>
  <style>
    * {
      box-sizing: border-box;
      touch-action: none; /* Prevents phone from scrolling or zooming */
    }
    body {
      margin: 0;
      padding: 0;
      background-color: #070b14;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100vw;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #fff;
      user-select: none;
      -webkit-user-select: none;
      overflow: hidden;
    }
    #ui-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 8px;
    }
    h1 {
      margin: 0;
      font-size: 20px;
      letter-spacing: 1px;
    }
    .hint {
      color: #94a3b8;
      font-size: 12px;
    }
    button {
      background: #0284c7;
      color: #fff;
      border: none;
      padding: 5px 12px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      font-size: 12px;
    }
    button:hover {
      background: #0369a1;
    }
    #game-container {
      width: 95vw;
      max-width: 920px;
      aspect-ratio: 920 / 540;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    canvas {
      width: 100%;
      height: 100%;
      border: 3px solid #38bdf8;
      background: radial-gradient(circle at center, #1e293b 0%, #0a0f1d 100%);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
      border-radius: 12px;
      cursor: crosshair;
    }
  </style>
</head>
<body>

  <div id="ui-bar">
    <h1>Air Hockey</h1>
    <span class="hint">Drag finger or move mouse</span>
    <button id="fullscreenBtn">⛶ Fullscreen</button>
  </div>

  <div id="game-container">
    <canvas id="gameCanvas" width="920" height="540"></canvas>
  </div>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const fullscreenBtn = document.getElementById("fullscreenBtn");

    let playerScore = 0;
    let aiScore = 0;

    // Arena dimensions
    const goalHeight = 190;
    const goalTop = (canvas.height - goalHeight) / 2;
    const goalBottom = goalTop + goalHeight;
    const goalBoxWidth = 32;

    // Striker (Mallet)
    const strikerRadius = 28;
    let playerX = 140;
    let playerY = canvas.height / 2;
    const keyboardSpeed = 7.5;

    let aiX = canvas.width - 140;
    let aiY = canvas.height / 2;

    // Puck
    const puckRadius = 14;
    let puckX = canvas.width / 2;
    let puckY = canvas.height / 2;
    let puckSpeedX = 6;
    let puckSpeedY = 3;
    const baseSpeed = 6;
    const speedBoost = 1.05;

    // Touch & Mouse Handler with proportional scaling
    function handlePointer(clientX, clientY) {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;

      const targetX = (clientX - rect.left) * scaleX;
      const targetY = (clientY - rect.top) * scaleY;

      clampAndSetPlayerPosition(targetX, targetY);
    }

    // Keep striker in player half
    function clampAndSetPlayerPosition(x, y) {
      const minX = goalBoxWidth + strikerRadius;
      const maxX = (canvas.width / 2) - strikerRadius - 4;
      const minY = strikerRadius;
      const maxY = canvas.height - strikerRadius;

      playerX = Math.max(minX, Math.min(maxX, x));
      playerY = Math.max(minY, Math.min(maxY, y));
    }

    // Mouse Listeners
    canvas.addEventListener("mousemove", (e) => {
      handlePointer(e.clientX, e.clientY);
    });

    // Touch Listeners for Phones & Tablets
    function onTouch(e) {
      e.preventDefault();
      if (e.touches.length > 0) {
        handlePointer(e.touches[0].clientX, e.touches[0].clientY);
      }
    }

    canvas.addEventListener("touchstart", onTouch, { passive: false });
    canvas.addEventListener("touchmove", onTouch, { passive: false });

    // Keyboard support (W, A, S, D & Arrows)
    const keys = { ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false, w: false, s: false, a: false, d: false };
    window.addEventListener("keydown", (e) => {
      const k = e.key.toLowerCase();
      if (keys.hasOwnProperty(e.key) || keys.hasOwnProperty(k)) { keys[e.key] = true; keys[k] = true; }
      if (k === "f") toggleFullscreen();
    });
    window.addEventListener("keyup", (e) => {
      const k = e.key.toLowerCase();
      if (keys.hasOwnProperty(e.key) || keys.hasOwnProperty(k)) { keys[e.key] = false; keys[k] = false; }
    });

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen();
      }
    }
    fullscreenBtn.addEventListener("click", toggleFullscreen);

    function resetPuck(scoredBy) {
      puckX = canvas.width / 2;
      puckY = canvas.height / 2;
      const dir = scoredBy === "player" ? 1 : -1;
      puckSpeedX = dir * baseSpeed;
      puckSpeedY = (Math.random() * 4 - 2);
    }

    function handleCollision(sx, sy) {
      const dx = puckX - sx;
      const dy = puckY - sy;
      const dist = Math.hypot(dx, dy);

      if (dist < strikerRadius + puckRadius) {
        const nx = dx / dist;
        const ny = dy / dist;

        let speed = Math.hypot(puckSpeedX, puckSpeedY) * speedBoost;
        speed = Math.min(speed, 16.5);

        puckSpeedX = nx * speed;
        puckSpeedY = ny * speed;

        puckX = sx + nx * (strikerRadius + puckRadius + 1);
        puckY = sy + ny * (strikerRadius + puckRadius + 1);
      }
    }

    function update() {
      let moveX = 0;
      let moveY = 0;
      if (keys.ArrowUp || keys.w) moveY -= keyboardSpeed;
      if (keys.ArrowDown || keys.s) moveY += keyboardSpeed;
      if (keys.ArrowLeft || keys.a) moveX -= keyboardSpeed;
      if (keys.ArrowRight || keys.d) moveX += keyboardSpeed;

      if (moveX !== 0 || moveY !== 0) {
        clampAndSetPlayerPosition(playerX + moveX, playerY + moveY);
      }

      puckX += puckSpeedX;
      puckY += puckSpeedY;

      // Arena Top & Bottom Bounce
      if (puckY - puckRadius <= 0) {
        puckY = puckRadius;
        puckSpeedY = Math.abs(puckSpeedY);
      } else if (puckY + puckRadius >= canvas.height) {
        puckY = canvas.height - puckRadius;
        puckSpeedY = -Math.abs(puckSpeedY);
      }

      // Left Wall Bounce & Goal
      if (puckX - puckRadius <= goalBoxWidth) {
        const insideGoal = puckY > goalTop && puckY < goalBottom;
        if (!insideGoal) {
          puckX = goalBoxWidth + puckRadius;
          puckSpeedX = Math.abs(puckSpeedX);
        } else if (puckX < 0) {
          aiScore++;
          resetPuck("ai");
          return;
        }
      }

      // Right Wall Bounce & Goal
      if (puckX + puckRadius >= canvas.width - goalBoxWidth) {
        const insideGoal = puckY > goalTop && puckY < goalBottom;
        if (!insideGoal) {
          puckX = canvas.width - goalBoxWidth - puckRadius;
          puckSpeedX = -Math.abs(puckSpeedX);
        } else if (puckX > canvas.width) {
          playerScore++;
          resetPuck("player");
          return;
        }
      }

      // AI Logic
      let targetAiX = canvas.width - 130;
      let targetAiY = canvas.height / 2;

      if (puckX > canvas.width / 2) {
        targetAiX = puckX + 32;
        targetAiY = puckY;
      } else {
        targetAiX = canvas.width - 120;
        targetAiY = canvas.height / 2 + (puckY - canvas.height / 2) * 0.45;
      }

      aiX += (targetAiX - aiX) * 0.085;
      aiY += (targetAiY - aiY) * 0.11;

      const aiMinX = (canvas.width / 2) + strikerRadius + 4;
      const aiMaxX = canvas.width - goalBoxWidth - strikerRadius;
      aiX = Math.max(aiMinX, Math.min(aiMaxX, aiX));
      aiY = Math.max(strikerRadius, Math.min(canvas.height - strikerRadius, aiY));

      handleCollision(playerX, playerY);
      handleCollision(aiX, aiY);
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.strokeStyle = "rgba(255, 255, 255, 0.12)";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(canvas.width / 2, canvas.height / 2, 75, 0, Math.PI * 2);
      ctx.stroke();

      ctx.strokeStyle = "#38bdf8";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(canvas.width / 2, 0);
      ctx.lineTo(canvas.width / 2, canvas.height);
      ctx.stroke();

      // Goal Nets
      ctx.fillStyle = "rgba(16, 185, 129, 0.15)";
      ctx.fillRect(0, goalTop, goalBoxWidth, goalHeight);
      ctx.fillStyle = "rgba(239, 68, 68, 0.15)";
      ctx.fillRect(canvas.width - goalBoxWidth, goalTop, goalBoxWidth, goalHeight);

      // Solid Bumpers
      ctx.fillStyle = "#334155";
      ctx.fillRect(0, 0, goalBoxWidth, goalTop);
      ctx.fillRect(0, goalBottom, goalBoxWidth, canvas.height - goalBottom);
      ctx.fillRect(canvas.width - goalBoxWidth, 0, goalBoxWidth, goalTop);
      ctx.fillRect(canvas.width - goalBoxWidth, goalBottom, goalBoxWidth, canvas.height - goalBottom);

      // Posts
      ctx.fillStyle = "#10b981";
      ctx.fillRect(goalBoxWidth - 3, goalTop - 3, 6, 6);
      ctx.fillRect(goalBoxWidth - 3, goalBottom - 3, 6, 6);
      ctx.fillStyle = "#ef4444";
      ctx.fillRect(canvas.width - goalBoxWidth - 3, goalTop - 3, 6, 6);
      ctx.fillRect(canvas.width - goalBoxWidth - 3, goalBottom - 3, 6, 6);

      // Player Mallet (Green)
      ctx.fillStyle = "#10b981";
      ctx.shadowColor = "#10b981";
      ctx.shadowBlur = 14;
      ctx.beginPath();
      ctx.arc(playerX, playerY, strikerRadius, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#064e3b";
      ctx.beginPath();
      ctx.arc(playerX, playerY, strikerRadius * 0.45, 0, Math.PI * 2);
      ctx.fill();

      // AI Mallet (Red)
      ctx.fillStyle = "#ef4444";
      ctx.shadowColor = "#ef4444";
      ctx.shadowBlur = 14;
      ctx.beginPath();
      ctx.arc(aiX, aiY, strikerRadius, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#7f1d1d";
      ctx.beginPath();
      ctx.arc(aiX, aiY, strikerRadius * 0.45, 0, Math.PI * 2);
      ctx.fill();

      // Puck
      ctx.fillStyle = "#38bdf8";
      ctx.shadowColor = "#38bdf8";
      ctx.shadowBlur = 16;
      ctx.beginPath();
      ctx.arc(puckX, puckY, puckRadius, 0, Math.PI * 2);
      ctx.fill();

      // Scores
      ctx.shadowBlur = 0;
      ctx.font = "bold 44px monospace";
      ctx.fillStyle = "#475569";
      ctx.fillText(playerScore, canvas.width / 4, 75);
      ctx.fillText(aiScore, (3 * canvas.width) / 4, 75);
    }

    function gameLoop() {
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }

    gameLoop();
  </script>
</body>
</html>
